# Example scheduled/triggered jobs. Copy to $SYSTEMA_HOME/schedules.toml (default ~/.systema/).
# Each job names an agent, a prompt and EXACTLY ONE trigger:
#   every     = "6h"        interval (s/m/h/d)
#   on_change = "~/path"    fire when a file/dir's modification time changes
#   on_board  = "ops"       fire on a new board post to this topic (empty/"*" = any topic)
# Jobs run through the normal broker/approvals/audit. A new job arms on first sight and fires on
# the NEXT change, not at startup; a job already running is skipped, not overlapped.

[[job]]
name = "log-sweep"
agent = "operator"          # optional; defaults to operator
prompt = "Summarize any errors or warnings in the last 6 hours of the system journal, and post a short note to the message board on topic 'ops' if anything needs attention."
every = "6h"                # interval trigger
enabled = false             # flip to true to activate

[[job]]
name = "on-new-ops-post"
agent = "operator"
prompt = "A new message was posted to the 'ops' board topic. Read the board and act on it if needed."
on_board = "ops"            # board-post trigger
enabled = false

[[job]]
name = "on-config-change"
agent = "sysadmin"
prompt = "A watched config file changed. Review it and post a note to the board on topic 'ops' summarizing what changed and whether anything needs attention."
on_change = "~/.config/someapp/config.toml"   # file-change trigger
enabled = false
