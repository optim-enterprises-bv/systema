[package]
name = "systema-console"
description = "Systema console: a browser dashboard over the node's control socket -- live trace, agents, approvals, swarm peers. Inspired by the iii engine's console (workers/functions/triggers UI), native to Systema's own control plane."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "systema-console"
path = "src/main.rs"

[dependencies]
