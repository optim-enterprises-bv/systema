<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Systema Console</title>
<meta name="color-scheme" content="light dark">
<script>
  // Same boot-time theme resolution iii's console uses: stored choice, else OS preference,
  // applied before first paint so there is no flash of the wrong theme.
  (() => {
    const prefersDark = () => window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
    let theme;
    try {
      const stored = localStorage.getItem('systema-theme');
      theme = stored === 'dark' || stored === 'light' ? stored : (prefersDark() ? 'dark' : 'light');
    } catch { theme = prefersDark() ? 'dark' : 'light'; }
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  })();
</script>
<style>
  /* Token names and values match iii's own console (see docs/IIi-FUSION.md) so the two read as
     one family: a layered panel/surface/ink scale, a 6/8px radius step, Inter for UI text and
     the system mono stack for anything technical -- not a from-scratch theme. */
  :root {
    --radius-sm: 6px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
      "Noto Sans", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
      "Courier New", monospace;
  }
  :root[data-theme="light"] {
    --color-bg: #f5f5f5;
    --color-panel: #fcfcfc;
    --color-panel-raised: #ffffff;
    --color-ink: #0a0a0a;
    --color-ink-faint: #686868;
    --color-ink-ghost: #909090;
    --color-surface: rgba(10, 10, 10, 0.05);
    --color-surface-hover: rgba(10, 10, 10, 0.09);
    --color-edge: rgba(10, 10, 10, 0.1);
    --color-accent: #383838;
    --color-accent-fg: #f5f5f5;
    --color-ok: #356f3d;
    --color-ok-muted: rgba(53, 111, 61, 0.12);
    --color-warn: #a87a00;
    --color-warn-muted: rgba(168, 122, 0, 0.12);
    --color-alert: #c60021;
    --color-alert-muted: rgba(198, 0, 33, 0.1);
  }
  :root[data-theme="dark"] {
    --color-bg: #0a0a0a;
    --color-panel: #111111;
    --color-panel-raised: #171717;
    --color-ink: #ededed;
    --color-ink-faint: #a6a6a6;
    --color-ink-ghost: #6f6f6f;
    --color-surface: rgba(255, 255, 255, 0.06);
    --color-surface-hover: rgba(255, 255, 255, 0.1);
    --color-edge: rgba(255, 255, 255, 0.12);
    --color-accent: #dedede;
    --color-accent-fg: #070909;
    --color-ok: #36c98f;
    --color-ok-muted: rgba(54, 201, 143, 0.15);
    --color-warn: #f5a524;
    --color-warn-muted: rgba(245, 165, 36, 0.15);
    --color-alert: #f05d68;
    --color-alert-muted: rgba(240, 93, 104, 0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-sans); font-size: 13px;
    background: var(--color-bg); color: var(--color-ink);
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; background: var(--color-panel); border-bottom: 1px solid var(--color-edge);
  }
  header h1 {
    font-size: 14px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px;
  }
  header h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-ok); display: inline-block; }
  #status-line { color: var(--color-ink-faint); font-family: var(--font-mono); font-size: 12px; }
  #theme-toggle {
    background: var(--color-surface); color: var(--color-ink); border: 1px solid var(--color-edge);
    border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  main {
    display: grid; grid-template-columns: 280px 1fr 320px; gap: 12px;
    padding: 12px; height: calc(100vh - 49px); max-width: 1600px; margin: 0 auto;
  }
  .col { display: flex; flex-direction: column; gap: 12px; overflow: hidden; min-width: 0; }
  .panel {
    background: var(--color-panel-raised); border: 1px solid var(--color-edge);
    border-radius: var(--radius-lg); padding: 12px; overflow-y: auto; flex: 1 1 auto; min-height: 0;
  }
  .panel.fixed { flex: 0 0 auto; }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
    color: var(--color-ink-faint); margin: 0 0 10px;
  }
  .row {
    padding: 8px 10px; margin: 0 -2px 4px; border-radius: var(--radius-sm);
  }
  .row:hover { background: var(--color-surface-hover); }
  .row b { font-weight: 600; }
  .muted { color: var(--color-ink-ghost); }
  button {
    background: var(--color-accent); color: var(--color-accent-fg); border: none;
    border-radius: var(--radius-sm); padding: 6px 12px; font-family: var(--font-sans);
    font-size: 12px; font-weight: 500; cursor: pointer; margin-right: 6px; margin-top: 4px;
  }
  button:hover { opacity: .85; }
  button.deny { background: var(--color-alert-muted); color: var(--color-alert); }
  button.ghost { background: transparent; color: var(--color-ink); border: 1px solid var(--color-edge); }
  textarea, input, select {
    width: 100%; background: var(--color-surface); color: var(--color-ink); border: 1px solid var(--color-edge);
    border-radius: var(--radius-sm); padding: 7px 9px; font-family: var(--font-sans); font-size: 12px;
    margin-bottom: 6px;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--color-ink-ghost); outline-offset: -1px; }
  #events { font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; word-break: break-word; }
  .ev { padding: 6px 0; border-bottom: 1px solid var(--color-edge); }
  .ev .k { color: var(--color-ink); font-weight: 600; }
  #ask-answer {
    white-space: pre-wrap; margin-top: 8px; font-family: var(--font-mono); font-size: 12px;
    color: var(--color-ink-faint);
  }
  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 10px;
    font-family: var(--font-mono); background: var(--color-surface); color: var(--color-ink-faint);
  }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>Systema Console</h1>
  <span id="status-line">connecting…</span>
  <button id="theme-toggle" onclick="toggleTheme()">☀/☽</button>
</header>
<main>
  <div class="col">
    <div class="panel" id="agents-panel"><h2>Agents</h2><div id="agents"></div></div>
    <div class="panel" id="peers-panel"><h2>Swarm peers</h2><div id="peers"></div></div>
    <div class="panel" id="mcp-panel">
      <h2>MCP servers (runtime)</h2>
      <div id="mcp-servers"></div>
      <input id="mcp-name" placeholder="name">
      <input id="mcp-command" placeholder="command, e.g. npx">
      <input id="mcp-args" placeholder="args, comma-separated">
      <button class="ghost" onclick="addMcpServer()">Add / replace</button>
    </div>
  </div>
  <div class="col">
    <div class="panel fixed">
      <h2>Ask an agent</h2>
      <select id="ask-agent"></select>
      <textarea id="ask-text" rows="3" placeholder="what do you need?"></textarea>
      <button onclick="doAsk()">Send</button>
      <div id="ask-answer"></div>
    </div>
    <div class="panel">
      <h2>Live trace</h2>
      <div id="events"></div>
    </div>
  </div>
  <div class="col">
    <div class="panel"><h2>Approvals</h2><div id="approvals"></div></div>
    <div class="panel"><h2>Inbox (unknown peers)</h2><div id="inbox"></div></div>
    <div class="panel"><h2>Sessions</h2><div id="sessions"></div></div>
  </div>
</main>
<script>
function toggleTheme() {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  document.documentElement.style.colorScheme = next;
  try { localStorage.setItem('systema-theme', next); } catch {}
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function refreshStatus() {
  try {
    const s = await api('/api/status');
    document.getElementById('status-line').textContent =
      `peer ${s.peer_id || '?'} · ${(s.addresses||[]).length} addr · ${s.peer_count ?? s.peers ?? '?'} peers`;
  } catch (e) { document.getElementById('status-line').textContent = 'node unreachable: ' + e.message; }
}

async function refreshAgents() {
  try {
    const list = await api('/api/agents');
    const arr = Array.isArray(list) ? list : (list.agents || []);
    document.getElementById('agents').innerHTML = arr.map(a =>
      `<div class="row"><b>${esc(a.name||a)}</b><br><span class="muted">${esc(a.description||'')}</span></div>`
    ).join('') || '<div class="muted">no agents loaded</div>';
    const sel = document.getElementById('ask-agent');
    sel.innerHTML = arr.map(a => `<option value="${esc(a.name||a)}">${esc(a.name||a)}</option>`).join('');
  } catch (e) { document.getElementById('agents').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

async function refreshPeers() {
  try {
    const list = await api('/api/peers');
    const arr = Array.isArray(list) ? list : (list.peers || []);
    document.getElementById('peers').innerHTML = arr.map(p =>
      `<div class="row">${esc(p.peer_id||p.id||p)}<br><span class="muted">${esc((p.skills||[]).join(', '))}</span></div>`
    ).join('') || '<div class="muted">no peers discovered</div>';
  } catch (e) { document.getElementById('peers').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

async function refreshApprovals() {
  try {
    const list = await api('/api/approvals');
    const arr = Array.isArray(list) ? list : (list.approvals || []);
    document.getElementById('approvals').innerHTML = arr.map(a => `
      <div class="row">
        <div>${esc(a.agent||'')}: ${esc(a.request||a.reason||'')}</div>
        <button onclick="resolveApproval('${a.id}','once')">Allow once</button>
        <button onclick="resolveApproval('${a.id}','always')">Always</button>
        <button class="deny" onclick="resolveApproval('${a.id}','deny')">Deny</button>
      </div>`
    ).join('') || '<div class="muted">nothing waiting</div>';
  } catch (e) { document.getElementById('approvals').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

async function resolveApproval(id, answer) {
  await api('/api/resolve', { method: 'POST', headers: {'content-type':'application/json'},
    body: JSON.stringify({ id, answer, remember: answer === 'always' }) });
  refreshApprovals();
}

async function refreshInbox() {
  try {
    const list = await api('/api/inbox');
    const arr = Array.isArray(list) ? list : (list.inbox || []);
    document.getElementById('inbox').innerHTML = arr.map(i => `
      <div class="row">
        <div>${esc(i.peer||'')} → ${esc(i.skill||'')}</div>
        <button onclick="approveInbox('${i.id}')">Approve</button>
        <button class="deny" onclick="rejectInbox('${i.id}')">Reject</button>
      </div>`
    ).join('') || '<div class="muted">empty</div>';
  } catch (e) { document.getElementById('inbox').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}
async function approveInbox(id) {
  await api('/api/approve', { method: 'POST', headers: {'content-type':'application/json'},
    body: JSON.stringify({ id, per_hour: 10, hours: null }) });
  refreshInbox();
}
async function rejectInbox(id) {
  await api('/api/reject', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ id }) });
  refreshInbox();
}

async function refreshSessions() {
  try {
    const list = await api('/api/sessions');
    const arr = Array.isArray(list) ? list : (list.sessions || []);
    document.getElementById('sessions').innerHTML = arr.map(s =>
      `<div class="row">${esc(s.session||'')} <span class="badge">${esc(s.state||'')}</span></div>`
    ).join('') || '<div class="muted">idle</div>';
  } catch (e) { document.getElementById('sessions').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

async function refreshMcpServers() {
  try {
    const list = await api('/api/mcp-servers');
    const arr = Array.isArray(list) ? list : (list.servers || []);
    document.getElementById('mcp-servers').innerHTML = arr.map(s => `
      <div class="row">
        <b>${esc(s.name)}</b> <span class="muted">${esc(s.command)} ${esc((s.args||[]).join(' '))}</span>
        <button class="deny" onclick="removeMcpServer('${esc(s.name)}')">Remove</button>
      </div>`
    ).join('') || '<div class="muted">none configured</div>';
  } catch (e) { document.getElementById('mcp-servers').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}
async function addMcpServer() {
  const name = document.getElementById('mcp-name').value.trim();
  const command = document.getElementById('mcp-command').value.trim();
  const args = document.getElementById('mcp-args').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!name || !command) return;
  await api('/api/mcp-servers', { method: 'POST', headers: {'content-type':'application/json'},
    body: JSON.stringify({ name, config: { command, args, env: {}, tools: null, ask_tools: [],
      mode: 'allow', private: true, outbound: true, untrusted: true } }) });
  refreshMcpServers();
}
async function removeMcpServer(name) {
  await fetch('/api/mcp-servers/' + encodeURIComponent(name), { method: 'DELETE' });
  refreshMcpServers();
}

async function doAsk() {
  const agent = document.getElementById('ask-agent').value;
  const text = document.getElementById('ask-text').value;
  const out = document.getElementById('ask-answer');
  out.textContent = 'thinking…';
  try {
    const r = await api('/api/ask', { method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({ agent, text }) });
    out.textContent = r.answer || JSON.stringify(r);
  } catch (e) { out.textContent = 'error: ' + e.message; }
}

function startEvents() {
  const box = document.getElementById('events');
  const es = new EventSource('/api/events');
  es.onmessage = (ev) => {
    let k = ev.data, label = '';
    try { const j = JSON.parse(ev.data); k = JSON.stringify(j); label = j.event || ''; } catch {}
    const div = document.createElement('div');
    div.className = 'ev';
    div.innerHTML = `<span class="k">[${esc(label)}]</span> ${esc(k)}`;
    box.prepend(div);
    while (box.children.length > 300) box.removeChild(box.lastChild);
  };
  es.onerror = () => { es.close(); setTimeout(startEvents, 3000); };
}

function refreshAll() {
  refreshStatus(); refreshAgents(); refreshPeers(); refreshApprovals(); refreshInbox(); refreshSessions(); refreshMcpServers();
}
refreshAll();
setInterval(refreshAll, 4000);
startEvents();
</script>
</body>
</html>
