<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Systema Console</title>
<meta name="color-scheme" content="light dark">
<script>
  // Same boot-time theme resolution iii's console uses: stored choice, else OS preference,
  // applied before first paint so there is no flash of the wrong theme.
  (() => {
    const prefersDark = () => window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false;
    let theme;
    try {
      const stored = localStorage.getItem('systema-theme');
      theme = stored === 'dark' || stored === 'light' ? stored : (prefersDark() ? 'dark' : 'light');
    } catch { theme = prefersDark() ? 'dark' : 'light'; }
    document.documentElement.dataset.theme = theme;
    document.documentElement.style.colorScheme = theme;
  })();
</script>
<style>
  /* Token names and values match iii's own console (see docs/IIi-FUSION.md) so the two read as
     one family: a layered panel/surface/ink scale, a 6/8px radius step, Inter for UI text and
     the system mono stack for anything technical -- not a from-scratch theme. */
  :root {
    --radius-sm: 6px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --font-sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue",
      "Noto Sans", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono",
      "Courier New", monospace;
  }
  :root[data-theme="light"] {
    --color-bg: #f5f5f5;
    --color-panel: #fcfcfc;
    --color-panel-raised: #ffffff;
    --color-ink: #0a0a0a;
    --color-ink-faint: #686868;
    --color-ink-ghost: #909090;
    --color-surface: rgba(10, 10, 10, 0.05);
    --color-surface-hover: rgba(10, 10, 10, 0.09);
    --color-edge: rgba(10, 10, 10, 0.1);
    --color-accent: #383838;
    --color-accent-fg: #f5f5f5;
    --color-ok: #356f3d;
    --color-ok-muted: rgba(53, 111, 61, 0.12);
    --color-warn: #a87a00;
    --color-warn-muted: rgba(168, 122, 0, 0.12);
    --color-alert: #c60021;
    --color-alert-muted: rgba(198, 0, 33, 0.1);
  }
  :root[data-theme="dark"] {
    --color-bg: #0a0a0a;
    --color-panel: #111111;
    --color-panel-raised: #171717;
    --color-ink: #ededed;
    --color-ink-faint: #a6a6a6;
    --color-ink-ghost: #6f6f6f;
    --color-surface: rgba(255, 255, 255, 0.06);
    --color-surface-hover: rgba(255, 255, 255, 0.1);
    --color-edge: rgba(255, 255, 255, 0.12);
    --color-accent: #dedede;
    --color-accent-fg: #070909;
    --color-ok: #36c98f;
    --color-ok-muted: rgba(54, 201, 143, 0.15);
    --color-warn: #f5a524;
    --color-warn-muted: rgba(245, 165, 36, 0.15);
    --color-alert: #f05d68;
    --color-alert-muted: rgba(240, 93, 104, 0.15);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-sans); font-size: 13px;
    background: var(--color-bg); color: var(--color-ink);
  }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; background: var(--color-panel); border-bottom: 1px solid var(--color-edge);
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  header h1 .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-ok); display: inline-block; }
  #status-line { color: var(--color-ink-faint); font-family: var(--font-mono); font-size: 12px; }
  #theme-toggle {
    background: var(--color-surface); color: var(--color-ink); border: 1px solid var(--color-edge);
    border-radius: var(--radius-sm); padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  main {
    display: grid; grid-template-columns: 300px 1fr 320px; gap: 12px;
    padding: 12px; height: calc(100vh - 49px); max-width: 1800px; margin: 0 auto;
  }
  .col { display: flex; flex-direction: column; gap: 12px; overflow: hidden; min-width: 0; }
  .panel {
    background: var(--color-panel-raised); border: 1px solid var(--color-edge);
    border-radius: var(--radius-lg); padding: 12px; overflow-y: auto; flex: 1 1 auto; min-height: 0;
  }
  .panel.fixed { flex: 0 0 auto; }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600;
    color: var(--color-ink-faint); margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between;
  }
  .tabs { display: flex; gap: 4px; }
  .tab {
    background: transparent; color: var(--color-ink-faint); border: none; padding: 3px 8px;
    border-radius: var(--radius-sm); font-size: 11px; cursor: pointer; text-transform: none; letter-spacing: 0;
  }
  .tab.active { background: var(--color-surface); color: var(--color-ink); }
  .row { padding: 8px 10px; margin: 0 -2px 4px; border-radius: var(--radius-sm); cursor: default; }
  .row:hover { background: var(--color-surface-hover); }
  .row.clickable { cursor: pointer; }
  .row b { font-weight: 600; }
  .muted { color: var(--color-ink-ghost); }
  button {
    background: var(--color-accent); color: var(--color-accent-fg); border: none;
    border-radius: var(--radius-sm); padding: 6px 12px; font-family: var(--font-sans);
    font-size: 12px; font-weight: 500; cursor: pointer; margin-right: 6px; margin-top: 4px;
  }
  button:hover { opacity: .85; }
  button.deny { background: var(--color-alert-muted); color: var(--color-alert); }
  button.ghost { background: transparent; color: var(--color-ink); border: 1px solid var(--color-edge); }
  button.small { padding: 3px 8px; font-size: 11px; }
  textarea, input, select {
    width: 100%; background: var(--color-surface); color: var(--color-ink); border: 1px solid var(--color-edge);
    border-radius: var(--radius-sm); padding: 7px 9px; font-family: var(--font-sans); font-size: 12px;
    margin-bottom: 6px;
  }
  textarea:focus, input:focus, select:focus { outline: 2px solid var(--color-ink-ghost); outline-offset: -1px; }
  #events, #transcript, #workspace-preview {
    font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; word-break: break-word;
  }
  .ev { padding: 6px 0; border-bottom: 1px solid var(--color-edge); }
  .ev .k { color: var(--color-ink); font-weight: 600; }
  #ask-answer {
    white-space: pre-wrap; margin-top: 8px; font-family: var(--font-mono); font-size: 12px;
    color: var(--color-ink-faint);
  }
  .badge {
    display: inline-block; padding: 1px 6px; border-radius: 999px; font-size: 10px;
    font-family: var(--font-mono); background: var(--color-surface); color: var(--color-ink-faint);
  }
  .badge.ok { background: var(--color-ok-muted); color: var(--color-ok); }
  .badge.err { background: var(--color-alert-muted); color: var(--color-alert); }
  .step { padding: 6px 8px; margin: 4px 0; background: var(--color-surface); border-radius: var(--radius-sm); font-family: var(--font-mono); font-size: 11px; }
  .crumb { color: var(--color-ink-faint); cursor: pointer; }
  .crumb:hover { text-decoration: underline; }
  hr.sep { border: none; border-top: 1px solid var(--color-edge); margin: 10px 0; }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>Systema Console</h1>
  <span id="status-line">connecting…</span>
  <button id="theme-toggle" onclick="toggleTheme()">☀/☽</button>
</header>
<main>
  <div class="col">
    <div class="panel" id="agents-panel"><h2>Agents</h2><div id="agents"></div></div>
    <div class="panel" id="peers-panel"><h2>Swarm peers</h2><div id="peers"></div></div>
    <div class="panel">
      <h2>Providers</h2>
      <div id="providers"></div>
      <button class="ghost small" onclick="testProvider(null)">Test default endpoint</button>
      <hr class="sep">
      <input id="prov-name" placeholder="name">
      <input id="prov-endpoint" placeholder="endpoint, e.g. https://api.openai.com/v1">
      <input id="prov-key-env" placeholder="api key env var (optional)">
      <input id="prov-models" placeholder="models, comma-separated">
      <button class="ghost" onclick="addProvider()">Add / replace</button>
    </div>
    <div class="panel" id="mcp-panel">
      <h2>MCP servers (runtime)</h2>
      <div id="mcp-servers"></div>
      <input id="mcp-name" placeholder="name">
      <input id="mcp-command" placeholder="command, e.g. npx">
      <input id="mcp-args" placeholder="args, comma-separated">
      <button class="ghost" onclick="addMcpServer()">Add / replace</button>
    </div>
  </div>
  <div class="col">
    <div class="panel fixed">
      <h2>Chat</h2>
      <select id="ask-agent"></select>
      <textarea id="ask-text" rows="3" placeholder="what do you need?"></textarea>
      <button onclick="doAsk()">Send</button>
      <div id="ask-answer"></div>
    </div>
    <div class="panel">
      <h2>
        <span id="feed-title">Live trace</span>
        <span class="tabs">
          <button class="tab active" id="tab-live" onclick="showLive()">Live</button>
          <button class="tab" id="tab-history" onclick="showHistory()">History</button>
        </span>
      </h2>
      <div id="events"></div>
      <div id="history-view" style="display:none">
        <select id="history-agent" onchange="refreshHistory()"><option value="">All agents</option></select>
        <div id="history-list"></div>
        <div id="transcript"></div>
      </div>
    </div>
  </div>
  <div class="col">
    <div class="panel"><h2>Approvals</h2><div id="approvals"></div></div>
    <div class="panel"><h2>Inbox (unknown peers)</h2><div id="inbox"></div></div>
    <div class="panel"><h2>Sessions</h2><div id="sessions"></div></div>
    <div class="panel">
      <h2>Workspace</h2>
      <select id="workspace-agent" onchange="loadWorkspace(this.value, '')"></select>
      <div id="workspace-breadcrumb" class="muted" style="margin-bottom:6px"></div>
      <div id="workspace-list"></div>
      <div id="workspace-preview"></div>
      <input type="file" id="workspace-upload" style="margin-top:6px">
      <button class="ghost small" onclick="uploadToWorkspace()">Upload here</button>
    </div>
  </div>
</main>
<script>
function toggleTheme() {
  const cur = document.documentElement.dataset.theme;
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  document.documentElement.style.colorScheme = next;
  try { localStorage.setItem('systema-theme', next); } catch {}
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}
function esc(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function refreshStatus() {
  try {
    const s = await api('/api/status');
    document.getElementById('status-line').textContent =
      `peer ${s.peer_id || '?'} · ${(s.addresses||[]).length} addr · ${s.peer_count ?? s.peers ?? '?'} peers`;
  } catch (e) { document.getElementById('status-line').textContent = 'node unreachable: ' + e.message; }
}

let knownAgents = [];
async function refreshAgents() {
  try {
    const list = await api('/api/agents');
    const arr = Array.isArray(list) ? list : (list.agents || []);
    knownAgents = arr.map(a => a.name || a);
    document.getElementById('agents').innerHTML = arr.map(a =>
      `<div class="row"><b>${esc(a.name||a)}</b><br><span class="muted">${esc(a.description||'')}</span></div>`
    ).join('') || '<div class="muted">no agents loaded</div>';
    const sel = document.getElementById('ask-agent');
    const prevAsk = sel.value;
    sel.innerHTML = knownAgents.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    if (knownAgents.includes(prevAsk)) sel.value = prevAsk;
    const hsel = document.getElementById('history-agent');
    const prevH = hsel.value;
    hsel.innerHTML = '<option value="">All agents</option>' + knownAgents.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    hsel.value = prevH;
    const wsel = document.getElementById('workspace-agent');
    const prevW = wsel.value;
    wsel.innerHTML = knownAgents.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    if (knownAgents.includes(prevW)) wsel.value = prevW;
    else if (knownAgents.length && !wsAgent) loadWorkspace(knownAgents[0], '');
  } catch (e) { document.getElementById('agents').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

async function refreshPeers() {
  try {
    const list = await api('/api/peers');
    const arr = Array.isArray(list) ? list : (list.peers || []);
    document.getElementById('peers').innerHTML = arr.map(p =>
      `<div class="row">${esc(p.peer_id||p.id||p)}<br><span class="muted">${esc((p.skills||[]).join(', '))}</span></div>`
    ).join('') || '<div class="muted">no peers discovered</div>';
  } catch (e) { document.getElementById('peers').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

async function refreshApprovals() {
  try {
    const list = await api('/api/approvals');
    const arr = Array.isArray(list) ? list : (list.approvals || []);
    document.getElementById('approvals').innerHTML = arr.map(a => `
      <div class="row">
        <div>${esc(a.agent||'')}: ${esc(a.request||a.reason||'')}</div>
        <button onclick="resolveApproval('${a.id}','once')">Allow once</button>
        <button onclick="resolveApproval('${a.id}','always')">Always</button>
        <button class="deny" onclick="resolveApproval('${a.id}','deny')">Deny</button>
      </div>`
    ).join('') || '<div class="muted">nothing waiting</div>';
  } catch (e) { document.getElementById('approvals').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

async function resolveApproval(id, answer) {
  await api('/api/resolve', { method: 'POST', headers: {'content-type':'application/json'},
    body: JSON.stringify({ id, answer, remember: answer === 'always' }) });
  refreshApprovals();
}

async function refreshInbox() {
  try {
    const list = await api('/api/inbox');
    const arr = Array.isArray(list) ? list : (list.inbox || []);
    document.getElementById('inbox').innerHTML = arr.map(i => `
      <div class="row">
        <div>${esc(i.peer||'')} → ${esc(i.skill||'')}</div>
        <button onclick="approveInbox('${i.id}')">Approve</button>
        <button class="deny" onclick="rejectInbox('${i.id}')">Reject</button>
      </div>`
    ).join('') || '<div class="muted">empty</div>';
  } catch (e) { document.getElementById('inbox').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}
async function approveInbox(id) {
  await api('/api/approve', { method: 'POST', headers: {'content-type':'application/json'},
    body: JSON.stringify({ id, per_hour: 10, hours: null }) });
  refreshInbox();
}
async function rejectInbox(id) {
  await api('/api/reject', { method: 'POST', headers: {'content-type':'application/json'}, body: JSON.stringify({ id }) });
  refreshInbox();
}

async function refreshSessions() {
  try {
    const list = await api('/api/sessions');
    const arr = Array.isArray(list) ? list : (list.sessions || []);
    document.getElementById('sessions').innerHTML = arr.map(s =>
      `<div class="row">${esc(s.session||'')} <span class="badge">${esc(s.state||'')}</span></div>`
    ).join('') || '<div class="muted">idle</div>';
  } catch (e) { document.getElementById('sessions').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}

async function refreshMcpServers() {
  try {
    const list = await api('/api/mcp-servers');
    const arr = Array.isArray(list) ? list : (list.servers || []);
    document.getElementById('mcp-servers').innerHTML = arr.map(s => `
      <div class="row">
        <b>${esc(s.name)}</b> <span class="muted">${esc(s.command)} ${esc((s.args||[]).join(' '))}</span>
        <button class="deny" onclick="removeMcpServer('${esc(s.name)}')">Remove</button>
      </div>`
    ).join('') || '<div class="muted">none configured</div>';
  } catch (e) { document.getElementById('mcp-servers').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}
async function addMcpServer() {
  const name = document.getElementById('mcp-name').value.trim();
  const command = document.getElementById('mcp-command').value.trim();
  const args = document.getElementById('mcp-args').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!name || !command) return;
  await api('/api/mcp-servers', { method: 'POST', headers: {'content-type':'application/json'},
    body: JSON.stringify({ name, config: { command, args, env: {}, tools: null, ask_tools: [],
      mode: 'allow', private: true, outbound: true, untrusted: true } }) });
  refreshMcpServers();
}
async function removeMcpServer(name) {
  await fetch('/api/mcp-servers/' + encodeURIComponent(name), { method: 'DELETE' });
  refreshMcpServers();
}

// --- Providers (Phase 5) ---
async function refreshProviders() {
  try {
    const list = await api('/api/providers');
    const arr = Array.isArray(list) ? list : (list.providers || []);
    document.getElementById('providers').innerHTML = arr.map(p => `
      <div class="row">
        <b>${esc(p.name)}</b> <span class="muted">${esc(p.endpoint)}</span><br>
        <span class="muted">${esc((p.models||[]).join(', ')) || 'no models listed'}</span>
        ${p.has_api_key_env ? '<span class="badge">keyed</span>' : ''}
        <button class="small ghost" onclick="testProvider('${esc(p.name)}')">Test</button>
        <button class="small deny" onclick="removeProvider('${esc(p.name)}')">Remove</button>
      </div>`
    ).join('') || '<div class="muted">none added (default endpoint is always available)</div>';
  } catch (e) { document.getElementById('providers').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}
async function addProvider() {
  const name = document.getElementById('prov-name').value.trim();
  const endpoint = document.getElementById('prov-endpoint').value.trim();
  const api_key_env = document.getElementById('prov-key-env').value.trim() || null;
  const models = document.getElementById('prov-models').value.split(',').map(s => s.trim()).filter(Boolean);
  if (!name || !endpoint) return;
  await api('/api/providers', { method: 'POST', headers: {'content-type':'application/json'},
    body: JSON.stringify({ name, config: { endpoint, api_key_env, models } }) });
  refreshProviders();
}
async function removeProvider(name) {
  await fetch('/api/providers/' + encodeURIComponent(name), { method: 'DELETE' });
  refreshProviders();
}
async function testProvider(name) {
  try {
    await api(name ? `/api/providers/${encodeURIComponent(name)}/test` : '/api/providers/test', { method: 'POST' });
    alert((name || 'default endpoint') + ': reachable');
  } catch (e) { alert((name || 'default endpoint') + ': ' + e.message); }
}

// --- Chat (Ask) ---
async function doAsk() {
  const agent = document.getElementById('ask-agent').value;
  const text = document.getElementById('ask-text').value;
  const out = document.getElementById('ask-answer');
  out.textContent = 'thinking…';
  try {
    const r = await api('/api/ask', { method: 'POST', headers: {'content-type':'application/json'},
      body: JSON.stringify({ agent, text }) });
    out.textContent = r.answer || JSON.stringify(r);
    if (document.getElementById('tab-history').classList.contains('active')) refreshHistory();
  } catch (e) { out.textContent = 'error: ' + e.message; }
}

// --- Live trace / History tabs (Phase 6) ---
function showLive() {
  document.getElementById('tab-live').classList.add('active');
  document.getElementById('tab-history').classList.remove('active');
  document.getElementById('feed-title').textContent = 'Live trace';
  document.getElementById('events').style.display = '';
  document.getElementById('history-view').style.display = 'none';
}
function showHistory() {
  document.getElementById('tab-live').classList.remove('active');
  document.getElementById('tab-history').classList.add('active');
  document.getElementById('feed-title').textContent = 'Chat history';
  document.getElementById('events').style.display = 'none';
  document.getElementById('history-view').style.display = '';
  refreshHistory();
}
async function refreshHistory() {
  const agent = document.getElementById('history-agent').value;
  document.getElementById('transcript').innerHTML = '';
  try {
    const runs = await api('/api/history' + (agent ? `?agent=${encodeURIComponent(agent)}&limit=50` : '?limit=50'));
    const arr = Array.isArray(runs) ? runs : (runs.runs || []);
    document.getElementById('history-list').innerHTML = arr.map(r => `
      <div class="row clickable" onclick="loadTranscript('${esc(r.id)}')">
        <span class="badge ${r.ok ? 'ok' : 'err'}">${r.ok ? 'ok' : 'err'}</span>
        <b>${esc(r.agent)}</b> <span class="muted">${esc((r.prompt||'').slice(0,60))}</span>
      </div>`
    ).join('') || '<div class="muted">no runs recorded yet</div>';
  } catch (e) { document.getElementById('history-list').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}
async function loadTranscript(id) {
  const box = document.getElementById('transcript');
  box.textContent = 'loading…';
  try {
    const r = await api('/api/history/' + encodeURIComponent(id));
    const steps = (r.steps||[]).map(s => `<div class="step">${esc(s.tool)} → ${esc(s.outcome)}</div>`).join('');
    box.innerHTML = `<div class="row"><b>${esc(r.agent)}</b> <span class="badge ${r.ok?'ok':'err'}">${r.ok?'ok':'error'}</span> <span class="muted">${r.ms}ms</span></div>
      <div class="row">&gt; ${esc(r.prompt)}</div>${steps}<div class="row">${esc(r.answer)}</div>`;
  } catch (e) { box.textContent = 'error: ' + e.message; }
}

// --- Workspace browser (Phase 7) ---
let wsAgent = '', wsPath = '';
function crumbs(path) {
  const parts = path.split('/').filter(Boolean);
  let acc = '';
  const links = ['<span class="crumb" onclick="loadWorkspace(wsAgent,\'\')">/</span>'];
  for (const p of parts) {
    acc += (acc ? '/' : '') + p;
    links.push(`<span class="crumb" onclick="loadWorkspace(wsAgent,'${esc(acc)}')">${esc(p)}</span>`);
  }
  return links.join(' / ');
}
async function loadWorkspace(agent, path) {
  if (!agent) return;
  wsAgent = agent; wsPath = path || '';
  document.getElementById('workspace-agent').value = agent;
  document.getElementById('workspace-breadcrumb').innerHTML = crumbs(wsPath);
  document.getElementById('workspace-preview').textContent = '';
  try {
    const r = await api(`/api/workspace/${encodeURIComponent(agent)}?path=${encodeURIComponent(wsPath)}`);
    const entries = (r.entries||[]).slice().sort((a,b) => (b.is_dir-a.is_dir) || a.name.localeCompare(b.name));
    document.getElementById('workspace-list').innerHTML = entries.map(e => `
      <div class="row clickable" onclick="${e.is_dir
        ? `loadWorkspace(wsAgent, '${esc((wsPath?wsPath+'/':'')+e.name)}')`
        : `previewFile('${esc((wsPath?wsPath+'/':'')+e.name)}')`}">
        ${e.is_dir ? '📁' : '📄'} ${esc(e.name)} ${e.is_dir ? '' : `<span class="muted">${e.size}b</span>`}
      </div>`
    ).join('') || '<div class="muted">empty</div>';
  } catch (e) { document.getElementById('workspace-list').innerHTML = `<div class="muted">${esc(e.message)}</div>`; }
}
async function previewFile(path) {
  const box = document.getElementById('workspace-preview');
  box.textContent = 'loading…';
  try {
    const r = await api(`/api/workspace/${encodeURIComponent(wsAgent)}/file?path=${encodeURIComponent(path)}`);
    box.textContent = r.content + (r.truncated ? '\n[truncated]' : '');
  } catch (e) { box.textContent = 'error: ' + e.message; }
}
async function uploadToWorkspace() {
  const input = document.getElementById('workspace-upload');
  const file = input.files[0];
  if (!file || !wsAgent) return;
  const buf = await file.arrayBuffer();
  const b64 = btoa(new Uint8Array(buf).reduce((s, b) => s + String.fromCharCode(b), ''));
  const path = (wsPath ? wsPath + '/' : '') + file.name;
  await api(`/api/workspace/${encodeURIComponent(wsAgent)}/file`, { method: 'POST',
    headers: {'content-type':'application/json'}, body: JSON.stringify({ path, content_base64: b64 }) });
  input.value = '';
  loadWorkspace(wsAgent, wsPath);
}

function startEvents() {
  const box = document.getElementById('events');
  const es = new EventSource('/api/events');
  es.onmessage = (ev) => {
    let k = ev.data, label = '';
    try { const j = JSON.parse(ev.data); k = JSON.stringify(j); label = j.event || ''; } catch {}
    const div = document.createElement('div');
    div.className = 'ev';
    div.innerHTML = `<span class="k">[${esc(label)}]</span> ${esc(k)}`;
    box.prepend(div);
    while (box.children.length > 300) box.removeChild(box.lastChild);
  };
  es.onerror = () => { es.close(); setTimeout(startEvents, 3000); };
}

function refreshAll() {
  refreshStatus(); refreshAgents(); refreshPeers(); refreshApprovals(); refreshInbox(); refreshSessions();
  refreshMcpServers(); refreshProviders();
}
refreshAll();
setInterval(refreshAll, 4000);
startEvents();
</script>
