[package]
name = "systema-hub"
description = "Public bootstrap for the Systema swarm: a Kademlia DHT server and circuit relay, nothing else. No agents, no kernel, no trust state, no inference."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "systema_hub"
path = "src/lib.rs"

[[bin]]
name = "systema-hub"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { workspace = true, features = ["env"] }
futures.workspace = true
libp2p.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Only to pin that the hub speaks the exact protocol names of a real node.
systema-node.workspace = true
tempfile = "3"
